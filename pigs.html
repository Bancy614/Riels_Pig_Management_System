<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pig Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Navbar -->
   <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🐖 Riels Pig Management System</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="./pigs.html">Pigs</a></li>
          <li class="nav-item"><a class="nav-link" href="./feeding.html">Feeding</a></li>
          <li class="nav-item"><a class="nav-link" href="./vaccination.html">Vaccination</a></li>
          <li class="nav-item"><a class="nav-link" href="./reproduction.html">Reproduction</a></li>
          <li class="nav-item"><a class="nav-link" href="./lineage.html">Lineage</a></li>
          <li class="nav-item"><a class="nav-link" href="./finance.html">Finance</a></li>
          <li class="nav-item"><a class="nav-link" href="./reports.html">Reports</a></li>
        </ul>
      </div>
    </div>
  </nav>



  <div class="container mt-4">
    <h2 class="text-center mb-4 fw-bold">Pig Records</h2>

    <!-- Add Pig Form -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="fw-bold mb-3">Add New Pig</h5>
        <form id="addPigForm" class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Pig ID</label>
            <input type="text" class="form-control" id="pigId" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="dob" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Gender</label>
            <select class="form-select" id="gender" required>
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>

          <div class="col">
      <select id="pigStatus" class="form-control">
        <option>Alive</option>
        <option>Sold</option>
        <option>Dead</option>
      </select>
    </div>


          <div class="col-md-3">
            <label class="form-label">Mother ID</label>
            <input type="text" class="form-control" id="motherId" placeholder="If known">
          </div>

          <div class="col-md-3">
            <label class="form-label">Purchase?</label>
            <select class="form-select" id="purchaseStatus">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Purchase Price (Ksh)</label>
            <input type="number" class="form-control" id="purchasePrice" min="0">
          </div>

          <div class="col-md-3">
            <label class="form-label">Remarks</label>
            <select class="form-select" id="remarks">
              <option>Normal</option>
              <option>Good Mother</option>
              <option>Unreliable Mother</option>
            </select>
          </div>

          <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-success w-100">Add Pig</button>
            
          </div>

             <div class="col-md-3 d-flex align-items-end">
           
      <button type="submit" class="btn btn-success w-100">Edit</button>
           
          </div>

       
        </form>
      </div>
    </div>

    <!-- Pig Records Table -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="fw-bold mb-3">Current Pigs</h5>
        <table class="table table-striped">
          <thead class="table-success">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>DOB</th>
              <th>Gender</th>
              <th>Age (Months)</th>
              <th>Mother ID</th>
              <th>Status</th>
              <th>Purchase Date</th>
              <th>Sale Date</th>
              <th>Death Date</th>
              <th>Remarks</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="pigsTable">
            <tr><td colspan="8" class="text-center text-muted">No pigs recorded</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>



  <script>
    // pigs.js — Handles Pig Records CRUD, Syncs with Other Pages

// Select elements
const addPigForm = document.getElementById("addPigForm");
const pigsTable = document.getElementById("pigsTable");

let pigs = JSON.parse(localStorage.getItem("pigs")) || [];
let editMode = false;
let editIndex = null;

// Utility: Calculate Age (in months)
function calculateAge(dob) {
  const birthDate = new Date(dob);
  const now = new Date();
  const months = (now.getFullYear() - birthDate.getFullYear()) * 12 + (now.getMonth() - birthDate.getMonth());
  return months >= 0 ? months : 0;
}

// Save pigs to localStorage
function savePigs() {
  localStorage.setItem("pigs", JSON.stringify(pigs));
  renderTable();
  updateLinkedPages();
}

// Render table
function renderTable() {
  pigsTable.innerHTML = "";

  if (pigs.length === 0) {
    pigsTable.innerHTML = `<tr><td colspan="12" class="text-center text-muted">No pigs recorded</td></tr>`;
    return;
  }

  pigs.forEach((pig, index) => {
    const ageMonths = calculateAge(pig.dob);
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${pig.pigId}</td>
      <td>${pig.name || "-"}</td>
      <td>${pig.dob}</td>
      <td>${pig.gender}</td>
      <td>${ageMonths}</td>
      <td>${pig.motherId || "-"}</td>
      <td>${pig.status}</td>
      <td>${pig.purchaseStatus === "Yes" ? pig.purchaseDate || "-" : "-"}</td>
      <td>${pig.saleDate || "-"}</td>
      <td>${pig.deathDate || "-"}</td>
      <td>${pig.remarks}</td>
      <td>
        <button class="btn btn-sm btn-primary me-1" onclick="editPig(${index})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deletePig(${index})">Delete</button>
      </td>
    `;

    pigsTable.appendChild(row);
  });
}

// Handle Add/Edit form submission
addPigForm.addEventListener("submit", (e) => {
  e.preventDefault();

  const pigId = document.getElementById("pigId").value.trim();
  const dob = document.getElementById("dob").value;
  const gender = document.getElementById("gender").value;
  const motherId = document.getElementById("motherId").value.trim();
  const purchaseStatus = document.getElementById("purchaseStatus").value;
  const purchasePrice = parseFloat(document.getElementById("purchasePrice").value || 0);
  const remarks = document.getElementById("remarks").value;
  const status = document.getElementById("pigStatus").value;

  if (!pigId || !dob || !gender) {
    alert("Please fill in all required fields.");
    return;
  }

  const pigData = {
    pigId,
    dob,
    gender,
    motherId,
    purchaseStatus,
    purchasePrice,
    remarks,
    status,
    name: `${gender}-${pigId}`,
    purchaseDate: purchaseStatus === "Yes" ? new Date().toISOString().split("T")[0] : "",
    saleDate: "",
    deathDate: ""
  };

  if (editMode) {
    pigs[editIndex] = pigData;
    editMode = false;
    editIndex = null;
  } else {
    pigs.push(pigData);
  }

  savePigs();
  addPigForm.reset();
});

// Edit Pig
window.editPig = (index) => {
  const pig = pigs[index];
  editMode = true;
  editIndex = index;

  document.getElementById("pigId").value = pig.pigId;
  document.getElementById("dob").value = pig.dob;
  document.getElementById("gender").value = pig.gender;
  document.getElementById("motherId").value = pig.motherId;
  document.getElementById("purchaseStatus").value = pig.purchaseStatus;
  document.getElementById("purchasePrice").value = pig.purchasePrice;
  document.getElementById("remarks").value = pig.remarks;
  document.getElementById("pigStatus").value = pig.status;

  window.scrollTo({ top: 0, behavior: "smooth" });
};

// Delete Pig
window.deletePig = (index) => {
  if (confirm("Are you sure you want to delete this pig record?")) {
    pigs.splice(index, 1);
    savePigs();
  }
};

// Update Linked Pages (Dashboard, Finance, Reports)
function updateLinkedPages() {
  const total = pigs.length;
  const males = pigs.filter(p => p.gender === "Male").length;
  const females = pigs.filter(p => p.gender === "Female").length;
  const sold = pigs.filter(p => p.status === "Sold").length;
  const dead = pigs.filter(p => p.status === "Dead").length;

  // Dashboard summary data
  const summary = { total, males, females, sold, dead, updatedAt: new Date().toISOString() };
  localStorage.setItem("pigSummary", JSON.stringify(summary));

  // Finance sync (record pig purchases)
  const totalPurchaseCost = pigs.reduce((sum, p) => sum + (p.purchaseStatus === "Yes" ? p.purchasePrice : 0), 0);
  localStorage.setItem("financeData", JSON.stringify({
    ...JSON.parse(localStorage.getItem("financeData") || "{}"),
    pigPurchases: totalPurchaseCost
  }));

  // Notify other tabs/pages (Dashboard, Reports) to refresh
  window.dispatchEvent(new Event("storage"));
}

// Listen for cross-page updates
window.addEventListener("storage", () => {
  pigs = JSON.parse(localStorage.getItem("pigs")) || [];
  renderTable();
});

// Initial render
document.addEventListener("DOMContentLoaded", renderTable);



/**
 * Auto-populates the Pig Records table (#pigsTable)
 * whenever data changes (additions, edits, deletions).
 */
function updatePigsTable() {
  const pigsTableBody = document.getElementById("pigsTable");
  const pigsData = JSON.parse(localStorage.getItem("pigs")) || [];

  pigsTableBody.innerHTML = ""; // clear current table

  if (pigsData.length === 0) {
    pigsTableBody.innerHTML = `<tr><td colspan="12" class="text-center text-muted">No pigs recorded</td></tr>`;
    return;
  }

  pigsData.forEach((pig, index) => {
    const ageMonths = calculateAge(pig.dob);
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${pig.pigId}</td>
      <td>${pig.name || "-"}</td>
      <td>${pig.dob}</td>
      <td>${pig.gender}</td>
      <td>${ageMonths}</td>
      <td>${pig.motherId || "-"}</td>
      <td>${pig.status}</td>
      <td>${pig.purchaseStatus === "Yes" ? pig.purchaseDate || "-" : "-"}</td>
      <td>${pig.saleDate || "-"}</td>
      <td>${pig.deathDate || "-"}</td>
      <td>${pig.remarks || "-"}</td>
      <td>
        <button class="btn btn-sm btn-primary me-1" onclick="editPig(${index})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deletePig(${index})">Delete</button>
      </td>
    `;
    pigsTableBody.appendChild(row);
  });
}
  </script>

  <script src="./main.js"></script>
<script src="./manifest.json"></script>
  
</body>
</html>
