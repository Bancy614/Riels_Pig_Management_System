<div class="container mt-4">
  <h3 class="text-center fw-bold mb-4">Feeds Inventory</h3>

  <form id="feedForm" class="card p-3 shadow-sm">
    <div class="row g-3">
      <div class="col-md-4">
        <label>Feed Type</label>
        <input type="text" id="feedType" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label>Quantity (kg)</label>
        <input type="number" id="quantity" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label>Cost (Ksh)</label>
        <input type="number" id="cost" class="form-control" required>
      </div>
      <div class="col-md-2">
        <button class="btn btn-success w-100 mt-4">Add Feed</button>
      </div>
    </div>

    <div class="col-md-3 d-flex align-items-end">
           
            <button type="submit" class="btn btn-success w-100 me-2">Edit</button>
            
            <button type="submit" class="btn btn-success w-100">Save</button>
          </div>
  </form>

  <table class="table table-striped mt-4">
    <thead class="table-success">
      <tr>
        <th>Feed Type</th>
        <th>Quantity (kg)</th>
        <th>Cost (Ksh)</th>
      </tr>
    </thead>
    <tbody id="feedTable"></tbody>
  </table>
</div>





<div class="container mt-4">
  <h3 class="fw-bold text-center mb-4">Feeding Schedule by Age</h3>

  <form id="feedingForm" class="card p-3 shadow-sm">
    <div class="row g-3">
      <div class="col-md-4">
        <label>Pig ID</label>
        <input type="text" id="pigId" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label>Date of Birth</label>
        <input type="date" id="dob" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label>Current Weight (kg)</label>
        <input type="number" id="weight" class="form-control" required>
      </div>
    </div>
    <button class="btn btn-success mt-3">Generate Feeding Schedule</button>



  </form>

  <div id="feedingResult" class="mt-4"></div>
</div>

 

<script>document.addEventListener('DOMContentLoaded', loadFeeds);
document.getElementById('feedForm').addEventListener('submit', saveFeed);

function saveFeed(e){
  e.preventDefault();
  const feed = {
    type: document.getElementById('feedType').value,
    quantity: parseFloat(document.getElementById('quantity').value),
    cost: parseFloat(document.getElementById('cost').value)
  };

  const feeds = JSON.parse(localStorage.getItem('feeds')) || [];
  feeds.push(feed);
  localStorage.setItem('feeds', JSON.stringify(feeds));

  document.getElementById('feedForm').reset();
  loadFeeds();
}

function loadFeeds(){
  const feeds = JSON.parse(localStorage.getItem('feeds')) || [];
  const table = document.getElementById('feedTable');
  table.innerHTML = '';
  feeds.forEach(f => {
    table.innerHTML += `<tr>
      <td>${f.type}</td>
      <td>${f.quantity}</td>
      <td>${f.cost.toLocaleString()}</td>
    </tr>`;
  });
}



document.getElementById('feedingForm').addEventListener('submit', function(e){
  e.preventDefault();

  const pigId = document.getElementById('pigId').value;
  const dob = new Date(document.getElementById('dob').value);
  const today = new Date();
  const ageMonths = Math.floor((today - dob) / (1000*60*60*24*30));

  let feedType, frequency, remarks;
  if(ageMonths < 2){
    feedType = "Creep Feed";
    frequency = "3 times daily";
    remarks = "Piglet Stage (weaning soon)";
  } else if(ageMonths < 6){
    feedType = "Grower Feed";
    frequency = "2 times daily";
    remarks = "Grower Stage";
  } else {
    feedType = "Finisher Feed";
    frequency = "2 times daily";
    remarks = "Adult Pig";
  }

  document.getElementById('feedingResult').innerHTML = `
    <div class="card p-3 shadow-sm">
      <h5 class="text-success">Feeding Schedule for Pig ID: ${pigId}</h5>
      <ul>
        <li><b>Age:</b> ${ageMonths} months</li>
        <li><b>Feed Type:</b> ${feedType}</li>
        <li><b>Frequency:</b> ${frequency}</li>
        <li><b>Remarks:</b> ${remarks}</li>
      </ul>
    </div>
  `;
});</script>
