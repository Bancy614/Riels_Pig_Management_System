  <div class="container">
    <h3 class="fw-bold text-success mb-3">🐖 Pig Birth & Lineage Tracker</h3>
    <div id="lineageList" class="row g-3"></div>
  </div>



   <script src="./main.js"></script>
<script>
    /*Lineage js*/
    const pigs = JSON.parse(localStorage.getItem('pigs')) || [];

    const lineageContainer = document.getElementById('lineageList');
    const mothers = pigs.filter(p => p.gender === 'Female' && p.piglets && p.piglets.length > 0);

    if (mothers.length === 0) {
      lineageContainer.innerHTML = `<div class='alert alert-info'>No lineage records found. Add piglets and link to mothers in Pig Records.</div>`;
    } else {
      mothers.forEach(mother => {
        const piglets = mother.piglets.map(pid => pigs.find(p => p.id === pid)).filter(Boolean);
        const pigletList = piglets.map(p => `
          <li class="list-group-item">
            <strong>${p.name}</strong> — Born: ${p.dob} | Gender: ${p.gender} | Status: ${p.status || 'Alive'}
          </li>`).join('');

        const card = `
          <div class="col-md-6">
            <div class="card border-success shadow-sm">
              <div class="card-header bg-success text-white fw-bold">
                Mother: ${mother.name} (${mother.id})
              </div>
              <div class="card-body">
                <p><strong>Breed:</strong> ${mother.breed || 'N/A'}</p>
                <p><strong>Births:</strong> ${piglets.length}</p>
                <ul class="list-group">${pigletList}</ul>
              </div>
            </div>
          </div>
        `;
        lineageContainer.innerHTML += card;
      });
    }
</script>

 <script src="./main.js"></script>
<script src="./manifest.json"></script>

  

  
</body>
</html>
